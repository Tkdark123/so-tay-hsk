/* Kho từ HSK 1-5 nạp từ window.HSKDATA: [chữ, pinyin, nghĩa, cấp, loại từ, thanh điệu, chiết tự, cụm từ] */
const BASE=(window.HSKDATA||[]).map((r,i)=>({id:i+1,word:r[0],pinyin:r[1],meaning:r[2],hskLevel:r[3],pos:POS[r[4]]||'Danh từ',tone:[...r[5]].map(Number),breakdown:r[6],collocations:r[7],status:'unlearned'}));

const WMAP=new Map();BASE.forEach(b=>{if(!WMAP.has(b.word))WMAP.set(b.word,b)});
const PHR=(()=>{const seen=new Set(),out=[];
  BASE.forEach(b=>(b.collocations||[]).forEach(zh=>{
    if(seen.has(zh)||zh.length<2)return;
    const seg=[];let i=0,ok=true;
    while(i<zh.length){let f=null;for(let L=Math.min(4,zh.length-i);L>=1;L--){const t=zh.slice(i,i+L);if(t!==zh&&WMAP.has(t)){f=t;break}}
      if(!f){ok=false;break}seg.push(f);i+=f.length}
    if(!ok||seg.length<2)return;
    const ws=seg.map(x=>WMAP.get(x));
    if(ws.some(x=>/[\/\s,;·']/.test(x.pinyin)))return;
    seen.add(zh);
    out.push({id:'p'+out.length,zh,seg,py:ws.map(x=>x.pinyin).join(''),vi:ws.map(x=>x.meaning.split(/[;,(]/)[0].trim()).join(' + '),ids:[...new Set(ws.map(x=>x.id))],tones:ws.flatMap(x=>x.tone)});
  }));
  return out})();

const pad=n=>String(n).padStart(2,'0');
const ymd=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+n))};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const KEY='sotay-hsk3-v2',OLDKEY='sotay-hsk3-v1';
const STT={unlearned:'Chưa học',learning:'Đang học',mastered:'Đã thuộc'};
const build=st=>BASE.map(b=>({...b,status:st[b.word]||'unlearned'}));
function initial(){return{user:'',goal:10,words:build({}),fav:[],srs:{},log:{},best:0}}
const slim=S=>{
  const st={},srs={},nm=id=>S.words[id-1]&&S.words[id-1].word;
  S.words.forEach(w=>{if(w.status!=='unlearned')st[w.word]=w.status});
  Object.entries(S.srs).forEach(([id,e])=>{const w=nm(id);if(w)srs[w]=e});
  return{v:2,user:S.user,goal:S.goal,st,srs,fav:S.fav.map(nm).filter(Boolean),log:S.log,best:S.best||0};
};
function load(){
  const idOf=new Map(BASE.map(b=>[b.word,b.id])),base=initial();
  try{
    const r=JSON.parse(localStorage.getItem(KEY));
    if(r&&r.v===2){
      const srs={},fav=[];
      Object.entries(r.srs||{}).forEach(([w,e])=>{const id=idOf.get(w);if(id)srs[id]=e});
      (r.fav||[]).forEach(w=>{const id=idOf.get(w);if(id)fav.push(id)});
      return{...base,user:r.user||base.user,goal:r.goal||10,words:build(r.st||{}),fav,srs,log:r.log||{},best:r.best||0};
    }
  }catch(e){}
  try{
    const o=JSON.parse(localStorage.getItem(OLDKEY));
    if(o&&Array.isArray(o.words)){
      const ow={},st={},srs={},fav=[];
      o.words.forEach(w=>{ow[w.id]=w.word;if(w.status&&w.status!=='unlearned')st[w.word]=w.status});
      Object.entries(o.srs||{}).forEach(([id,e])=>{const nid=idOf.get(ow[id]);if(nid)srs[nid]=e});
      (o.fav||[]).forEach(id=>{const nid=idOf.get(ow[id]);if(nid)fav.push(nid)});
      return{...base,user:o.user||base.user,goal:o.goal||10,words:build(st),fav,srs,log:o.log||{},best:o.best||0};
    }
  }catch(e){}
  return base;
}
function speak(t){
  try{
    const s=window.speechSynthesis;if(!s)return;s.cancel();
    const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.85;
    const v=s.getVoices().find(v=>/zh/i.test(v.lang));if(v)u.voice=v;s.speak(u);
  }catch(e){}
}
function makeOpts(w,all,n=4){
  const o=shuffle(all.filter(x=>x.id!==w.id)).slice(0,n-1);
  return shuffle([w,...o]);
}

        <span className="px-2 py-0.5 rounded-full bg-panel2 border border-line text-mute">{w.pos}</span>
      </div>
      <div className="min-h-[24px]">
        {sm?<button type="button" onClick={()=>setRm(true)} className="text-mute border border-dashed border-line rounded-md px-2 py-0.5 text-xs">Chạm để hiện nghĩa</button>:<p className="text-[15px] font-medium">{w.meaning}</p>}
      </div>
      {!sm&&w.breakdown&&<p className="text-[13px] text-mute"><span className="text-fg/70">Chiết tự:</span> {w.breakdown}</p>}
      {w.collocations&&w.collocations.length>0&&(
        <div className="flex flex-wrap gap-1.5">{w.collocations.map(c=><button key={c} type="button" onClick={()=>speak(c)} className="font-han text-[13px] px-2 py-1 rounded-lg bg-panel2 border border-line hover:border-mute">{c}</button>)}</div>

        ))}

    </div>
  );

/* ---------- Speed Attack ---------- */
function Speed({words,commit,onExit,onBest,best}){
  const [t,setT]=useState(60),[run,setRun]=useState(false),[done,setDone]=useState(false),[ok,setOk]=useState(0),[bad,setBad]=useState(0),[w,setW]=useState(null),[opts,setOpts]=useState([]),[fb,setFb]=useState(null);
  const nq=()=>{const x=words[Math.floor(Math.random()*words.length)];setW(x);setOpts(makeOpts(x,words));setFb(null)};
  const start=()=>{setT(60);setOk(0);setBad(0);setDone(false);setRun(true);nq()};
  useEffect(()=>{if(!run)return;const id=setInterval(()=>setT(x=>x-1),1000);return()=>clearInterval(id)},[run]);

      {!run&&!done&&<div className="py-8"><p className="text-mute">60 giây, chọn nghĩa đúng của chữ Hán càng nhiều càng tốt.</p><p className="text-xs text-mute mt-1 num">Kỷ lục: {best||0}</p><Btn kind="pri" cls="mt-4" onClick={start}>Bắt đầu</Btn></div>}

      {run&&w&&<div className="pt-6">

          return <button key={o.id} type="button" onClick={()=>pick(o)} className={`text-sm py-3 px-3 rounded-xl border bg-panel2 ${c}`}>{o.meaning}</button>})}</div>
      </div>}

/* ---------- Ôn lại (SRS) ---------- */

function Phrases({words,srs,commit}){

    const c={};PHR.forEach(p=>{const miss=p.ids.filter(id=>!st[id]||st[id]==='unlearned');if(miss.length===1)c[miss[0]]=(c[miss[0]]||0)+1});

  },[st,words]);

  };

        <span className="px-3 py-1.5 rounded-full bg-panel2 border border-line text-sm num"><Unlock size={14} className="inline -mt-0.5 mr-1 text-accent"/>{avail.length}/{PHR.length} cụm</span></div></Card>

        {avail.length>=3?<div className="text-center"><p className="text-sm text-mute">Mỗi lượt 10 cụm, ưu tiên cụm có từ bạn còn yếu. Làm đúng sẽ tính vào thống kê ôn tập.</p><Btn kind="pri" cls="mt-4" onClick={begin}>Luyện {Math.min(10,avail.length)} cụm</Btn></div>

      </Card>}

const TABS=[['road','Lộ trình',MapI],['pick','Chọn từ',BookOpen],['cmp','So sánh',GitCompare],['prac','Luyện tập',Dumbbell],['rev','Ôn lại',Repeat],['sen','Đặt câu',PenLine],['stat','Thống kê',BarChart3]];

const IDOF=new Map(BASE.map(b=>[b.word,b.id]));
const CH=600,NCH=Math.ceil(BASE.length/CH);
const toChunks=p=>{
  const c={meta:{v:2,goal:p.goal,log:p.log,best:p.best||0}};
  for(let k=0;k<NCH;k++)c['c'+k]={st:{},srs:{},fav:[]};
  const ix=w=>Math.floor(((IDOF.get(w)||1)-1)/CH);
  Object.entries(p.st).forEach(([w,s])=>{c['c'+ix(w)].st[w]=s});
  Object.entries(p.srs).forEach(([w,e])=>{c['c'+ix(w)].srs[w]=e});
  p.fav.forEach(w=>{c['c'+ix(w)].fav.push(w)});
  Object.keys(c).forEach(k=>{c[k]=JSON.parse(JSON.stringify(c[k]))});
  return c;
};
const fromChunks=d=>{
  const m=d.meta;if(!m)return null;
  const r={v:2,goal:m.goal||10,log:m.log||{},best:m.best||0,st:{},srs:{},fav:[]};
  for(let k=0;k<NCH;k++){const c=d['c'+k];if(!c)continue;Object.assign(r.st,c.st||{});Object.assign(r.srs,c.srs||{});(c.fav||[]).forEach(w=>r.fav.push(w))}
  return r;
};
const fromSlim=r=>{
  const srs={},fav=[];
  Object.entries(r.srs||{}).forEach(([w,e])=>{const id=IDOF.get(w);if(id)srs[id]=e});
  (r.fav||[]).forEach(w=>{const id=IDOF.get(w);if(id)fav.push(id)});
  return{...initial(),user:'',goal:r.goal||10,words:build(r.st||{}),fav,srs,log:r.log||{},best:r.best||0};
};
const score=p=>Object.keys(p.st||{}).length*1000+Object.values(p.log||{}).reduce((a,x)=>a+(x.a||0)+(x.n||0),0);
const withTimeout=(pr,ms)=>Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);

  return <span className={`inline-flex items-baseline gap-1.5 px-2.5 py-1 rounded-lg bg-panel2 border ${c}`}><span className="font-han text-lg">{w.word}</span><span className="font-pin text-xs text-mute">{w.pinyin}</span><span className="text-xs text-mute">{w.meaning.split(/[;,(]/)[0]}</span></span>;

const noTone=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[0-9]/g,'').toLowerCase();
function Families({words,mode}){
  const [q,setQ]=useState(''),[lim,setLim]=useState(20),[onlyLearned,setOL]=useState(true);
  const groups=useMemo(()=>{
    const m=new Map();
    if(mode==='char'){words.forEach(w=>{if(w.word.length<2)return;new Set(w.word).forEach(ch=>{if(!m.has(ch))m.set(ch,[]);m.get(ch).push(w)})})}
    else{words.forEach(w=>{const k=mode==='same'?w.pinyin:noTone(w.pinyin);if(!m.has(k))m.set(k,[]);m.get(k).push(w)})}
    const out=[];
    m.forEach((ws,k)=>{
      if(mode==='char'){if(ws.length<3)return}
      else{if(new Set(ws.map(x=>x.word)).size<2)return}
      out.push({k,ws});
    });
    return out;
  },[words,mode]);
  const shown=useMemo(()=>{
    let g=groups.filter(x=>!onlyLearned||x.ws.some(w=>w.status!=='unlearned'));
    const s=q.trim().toLowerCase();
    if(s)g=g.filter(x=>x.k.toLowerCase().includes(s)||x.ws.some(w=>w.word.includes(s)||w.meaning.toLowerCase().includes(s)));
    return g.sort((a,b)=>b.ws.filter(w=>w.status!=='unlearned').length-a.ws.filter(w=>w.status!=='unlearned').length||b.ws.length-a.ws.length);
  },[groups,q,onlyLearned]);
  return(
    <div className="space-y-3">
      <Card><p className="text-sm text-mute">{mode==='char'?'Các từ chứa cùng một chữ. Hiểu nghĩa chữ gốc giúp đoán nghĩa từ mới.':mode==='same'?'Các từ đọc giống hệt nhau cả thanh điệu, dễ nhầm khi nghe.':'Các từ cùng âm tiết nhưng khác thanh điệu, dễ nhầm khi nghe.'}</p>
        <div className="flex gap-2 mt-3 flex-wrap items-center">
          <input value={q} onChange={e=>{setQ(e.target.value);setLim(20)}} placeholder={mode==='char'?'Tìm chữ hoặc nghĩa':'Tìm pinyin, chữ hoặc nghĩa'} className="flex-1 min-w-[160px] bg-panel2 border border-line rounded-xl px-3 py-2 text-sm outline-none focus:border-accent"/>
          <Pill on={onlyLearned} onClick={()=>setOL(!onlyLearned)}>Chỉ nhóm đã học</Pill>
        </div>
        <p className="text-xs text-mute mt-2 num">{shown.length} nhóm. Viền vàng là đang học, viền xanh là đã thuộc.</p></Card>
      {shown.slice(0,lim).map(g=>(
        <Card key={g.k}>
          <p className={`mb-2 ${mode==='char'?'font-han text-2xl':'font-pin text-lg'}`}>{g.k}</p>
          <div className="flex flex-wrap gap-2">{g.ws.slice(0,14).map(w=><WordChip key={w.id} w={w}/>)}{g.ws.length>14&&<span className="text-xs text-mute self-center">+{g.ws.length-14}</span>}</div>
        </Card>))}
      {shown.length>lim&&<Btn onClick={()=>setLim(lim+20)}>Xem thêm</Btn>}
      {!shown.length&&<Card><p className="text-sm text-mute">Chưa có nhóm nào. Học thêm từ hoặc bỏ lọc "Chỉ nhóm đã học".</p></Card>}
    </div>
  );
}

function Practice({ses,setSes,words,commit,best,onBest,newBatch}){

  if(ses?.mode==='flip') return <Flip ids={ses.ids} words={words} commit={commit} onExit={exit}/>;

  if(ses?.mode==='speed') return <Speed words={words} commit={commit} onExit={exit} best={best} onBest={onBest}/>;
  const pool=()=>{const l=words.filter(w=>w.status==='learning'),n=words.filter(w=>w.status==='unlearned'),m=words.filter(w=>w.status==='mastered');return shuffle([...l,...n,...shuffle(m)]).slice(0,10).map(w=>w.id)};

    ['flip','Lật thẻ 4 bước','Flashcard, chọn chữ Hán, chọn nghĩa, gõ pinyin. Qua đủ 4 bước không sai thì từ được tính là đã thuộc.',Layers,()=>{const b=newBatch();const ids=b.length?b:words.filter(w=>w.status==='learning').slice(0,5).map(w=>w.id);setSes({mode:'flip',ids})}],
    ['quick','Quick Review','Nhìn chữ, nhẩm nghĩa, hiện đáp án rồi tự chấm Thuộc hoặc Chưa thuộc.',Eye,()=>setSes({mode:'quick',ids:pool()})],

      <div className="grid gap-3 sm:grid-cols-3">{modes.map(([k,t,d,I,f])=>(
        <button key={k} type="button" onClick={f} className="text-left bg-panel border border-line rounded-2xl p-5 hover:border-accent transition-colors flex flex-col gap-3">

      {best>0&&<p className="text-xs text-mute num">Kỷ lục Speed Attack: {best}</p>}

function Stats({S,setS,today}){
  const {words,srs,log}=S;
  const ok=words.reduce((a,w)=>a+(srs[w.id]?.ok||0),0),bad=words.reduce((a,w)=>a+(srs[w.id]?.bad||0),0);
  const acc=ok+bad?Math.round(ok/(ok+bad)*100):null;

  const days=[6,5,4,3,2,1,0].map(n=>{const d=addDays(today,-n);return{d,a:log[d]?.a||0,l:d.slice(8)+'/'+d.slice(5,7)}});
  const mx=Math.max(1,...days.map(x=>x.a));
  const [out,setOut]=useState(''),[msg,setMsg]=useState(null),[conf,setConf]=useState(false);
  const ta=useRef(null);

    catch(e){try{ta.current&&ta.current.select();document.execCommand('copy');setMsg({ok:true,t:'Đã chọn và sao chép JSON.'})}catch(_){setMsg({ok:false,t:'Hãy bôi đen khung JSON rồi sao chép thủ công.'})}}
  };
  const stat=(l,v)=><div className="rounded-xl bg-panel2 border border-line p-3 min-w-0"><p className="text-xs text-mute">{l}</p><p className="text-xl font-semibold num mt-0.5">{v}</p></div>;
  return(
    <div className="space-y-4">
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
        {stat('Tỷ lệ chính xác',acc===null?'--':acc+'%')}{stat('Lượt trả lời',ok+bad)}{stat('Đã thuộc',words.filter(w=>w.status==='mastered').length)}{stat('Đang học',words.filter(w=>w.status==='learning').length)}
      </div>
      <Card>
        <h2 className="font-semibold">10 từ hay sai nhất</h2>
        {worst.length===0?<p className="text-sm text-mute mt-2">Chưa có từ nào bị sai. Luyện tập để có số liệu.</p>:
        <ol className="mt-3 divide-y divide-line">{worst.map((w,i)=>{const e=srs[w.id],r=Math.round(e.bad/(e.ok+e.bad)*100);return(
          <li key={w.id} className="py-2.5 flex items-center gap-3"><span className="w-5 text-xs text-mute num">{i+1}</span><Han text={w.word} tones={w.tone} cls="text-xl w-24 shrink-0"/><span className="text-sm text-mute truncate flex-1 min-w-0">{w.pinyin} · {w.meaning}</span>
            <span className="text-sm num text-bad shrink-0">{e.bad} sai · {r}%</span></li>)})}</ol>}
      </Card>
      <Card>
        <h2 className="font-semibold">Lượt trả lời 7 ngày gần nhất</h2>
        <div className="mt-4 flex items-end gap-2 h-28">{days.map(x=>(
          <div key={x.d} className="flex-1 flex flex-col items-center justify-end gap-1 h-full min-w-0"><span className="text-[11px] text-mute num">{x.a||''}</span>
            <div className="w-full rounded-t-md" style={{height:`${Math.max(x.a/mx*100,x.a?6:2)}%`,background:x.a?'var(--accent)':'var(--line)'}}/><span className="text-[11px] text-mute num">{x.l}</span></div>))}</div>
      </Card>
      <Card cls="space-y-4">
        <h2 className="font-semibold">Sao lưu và đặt lại</h2>
        <div>
          <p className="text-sm text-mute mb-2">Sao lưu tiến độ: tạo JSON rồi sao chép để cất. Tiến độ cũng tự lưu trong trình duyệt này.</p>
          <div className="flex flex-wrap gap-2"><Btn onClick={()=>{setOut(exportJson(S));setMsg(null)}}>Tạo JSON tiến độ</Btn>{out&&<Btn onClick={copy}><Copy size={14}/> Sao chép</Btn>}</div>
          {out&&<textarea id="export-json" ref={ta} readOnly value={out} className="mt-2 w-full h-32 bg-panel2 border border-line rounded-xl p-3 font-mono text-xs outline-none"/>}
        </div>
        {msg&&<Fb ok={msg.ok}>{msg.t}</Fb>}
        <div className="pt-4 border-t border-line">
          {!conf?<Btn kind="bad" onClick={()=>setConf(true)}>Xóa toàn bộ tiến độ</Btn>:
          <div className="flex flex-wrap items-center gap-2"><span className="text-sm text-bad">Xóa hết tiến độ học?</span><Btn kind="bad" onClick={()=>{setS(initial());setConf(false);setMsg(null);setOut('')}}>Xóa ngay</Btn><Btn onClick={()=>setConf(false)}>Hủy</Btn></div>}
        </div>
      </Card>
    </div>
  );
}

try{console.log('%cSổ tay HSK 3.0 © 2026 Phan Thanh Tuấn Kiệt. Bảo lưu mọi quyền.','font-weight:bold')}catch(e){}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
